# Cloudflare Worker configuration for Shaz Print.
# The Worker serves the built Vite app from ./dist (static assets) and
# exposes a visitor-counter endpoint at /api/count backed by KV.

name = "shaz"
main = "src/index.js"
compatibility_date = "2024-12-18"

# Serve the compiled frontend from ./dist as static assets.
[assets]
directory = "./dist"
binding = "ASSETS"

# KV namespace for the visitor counter.
[[kv_namespaces]]
binding = "VIEW_COUNTER"
id = "f6e1d8688cc7447cb5495118d6d2daa6"

# Local-dev override. Same namespace works for both.
# preview_id = "f6e1d8688cc7447cb5495118d6d2daa6"
