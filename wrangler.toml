# Cloudflare Pages + Workers configuration for Shaz Print
# The Pages Function at functions/api/count.ts reads this binding.

name = "shaz-print"
compatibility_date = "2024-12-18"
pages_build_output_dir = "dist"

# KV namespace for the visitor counter.
[[kv_namespaces]]
binding = "VIEW_COUNTER"
id = "f6e1d8688cc7447cb5495118d6d2daa6"

# Optional local-dev override. Same namespace works for both.
# preview_id = "f6e1d8688cc7447cb5495118d6d2daa6"
